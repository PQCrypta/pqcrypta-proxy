name: Release Please

on:
  push:
    branches: [main]
  # Builds the binary for a draft release that already exists, attaches it and
  # publishes the release: for a draft whose own build failed. Releases are
  # immutable once published (no asset can be added then, which is how v0.3.0
  # went out without one), so this only works on a draft.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to build, attach the binary to and publish
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The binary, built the way CI builds it: against OpenSSL 3.5, because the
  # runner's OpenSSL 3.0 lacks the 3.2+ symbols the proxy links
  # (SSL_get0_group_name, SSL_CTX_compress_certs) and the release build failed
  # to link against it. Linked statically, so that a downloaded binary runs
  # without OpenSSL 3.5 installed. release-please creates the release as a
  # draft (release-please-config.json): the asset goes up, then the release is
  # published, as immutable releases require.
  binary:
    name: Release binary
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Setup OpenSSL 3.5 (Linux)
        uses: ./.github/actions/setup-openssl-linux

      - name: Build release binary
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release --locked

      - name: Upload binary to the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: target/release/pqcrypta-proxy

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
