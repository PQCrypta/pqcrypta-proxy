<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>

  <!-- PQC Text -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#grad)">PQC</text>

  <!-- Subtle accent dots -->
  <circle cx="6" cy="6" r="1.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="26" cy="6" r="1.5" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="6" cy="26" r="1.5" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="26" cy="26" r="1.5" fill="#45b7d1" opacity="0.6"/>
</svg>
