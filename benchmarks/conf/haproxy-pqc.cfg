# HAProxy with post-quantum key exchange offered.
#
# Same file as the throughput config plus an explicit curve list. HAProxy 3.2.9
# here is built against OpenSSL 3.5.5, which carries ML-KEM natively — so this is
# a head-to-head on the same key exchange, not one product's PQC measured against
# another's classical. (The `-OPENSSL_AWSLC` in `haproxy -vv` means it is not the
# AWS-LC build; with OpenSSL 3.5 the groups come from OpenSSL instead.)
#
# X25519 is kept in the list so a classical client still connects, which is what
# lets the same listener answer both arms of the comparison.
global
    nbthread 4
    cpu-map auto:1/1-4 2-5
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-curves X25519MLKEM768:X25519:P-256
    tune.quic.socket-owner connection

defaults
    mode http
    no log
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    maxconn 60000

frontend bench_tcp
    bind 127.0.0.1:18443 ssl crt /root/bench/certs/bench.local.pem alpn h2,http/1.1
    default_backend static

frontend bench_quic
    bind quic4@127.0.0.1:18443 ssl crt /root/bench/certs/bench.local.pem alpn h3
    default_backend static

backend static
    balance roundrobin
    server s1 127.0.0.1:18080 maxconn 20000
