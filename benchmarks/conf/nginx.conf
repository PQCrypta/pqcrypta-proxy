# Static backend for the proxy benchmark.
#
# It exists only to answer three fixed bodies faster than either proxy in front
# of it can ask, so that what gets measured is the proxy and not this. The
# Python one it replaces topped out at 243 req/s on a 1 KB body — the 40 ms
# delayed-ACK stall you get from writing headers and body as separate uncorked
# sends — which would have capped both proxies at the same wrong number and
# produced a comparison of nothing.
#
# Bound to loopback on a high port: this box serves philibertsecurity.com on
# 80/443 from Apache and that is not to be disturbed.
worker_processes 2;
worker_cpu_affinity 01 10;          # cores 0 and 1; the proxies own 2-5
error_log /root/bench/out/nginx-error.log crit;
pid /root/bench/out/nginx.pid;
daemon on;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    error_log /root/bench/out/nginx-error.log crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;                 # the thing the Python backend lacked
    keepalive_timeout 120s;
    keepalive_requests 1000000;

    client_body_temp_path /root/bench/out/nginx-body;
    proxy_temp_path       /root/bench/out/nginx-proxy;
    fastcgi_temp_path     /root/bench/out/nginx-fcgi;
    uwsgi_temp_path       /root/bench/out/nginx-uwsgi;
    scgi_temp_path        /root/bench/out/nginx-scgi;

    server {
        listen 127.0.0.1:18080 backlog=16384 reuseport;
        server_name _;

        default_type application/octet-stream;
        root /srv/bench/www;

        # Served from memory after the first read; no per-request work beyond
        # the send itself.
        location = /empty { alias /srv/bench/www/empty.bin; }
        location = /1k    { alias /srv/bench/www/1k.bin; }
        location = /64k   { alias /srv/bench/www/64k.bin; }
        location = /status { stub_status; }
        location / { return 404; }
    }
}
