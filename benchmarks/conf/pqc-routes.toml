[waf]
enabled = false

[fingerprint]
enabled = false

[rate_limiting]
enabled = false

[advanced_rate_limiting]
enabled = false

[security]
dos_protection = false

[logging]
level = "error"
access_log = false
audit_log_enabled = false

[admin]
enabled = false

[ocsp]
enabled = false

[acme]
enabled = false

[cache]
enabled = false

[otel]
enabled = false

[conformance]
enabled = false

[masque]
enabled = false

[http_redirect]
# Off: the default binds port 80, which the production node on this box owns.
enabled = false

[connection_pool]
# Matched to what production actually runs, and comparable to HAProxy's
# maxconn 20000 on the same backend. Leaving this at the built-in default of 10
# idle connections per host meant that at concurrency 100 most requests opened a
# fresh backend TCP connection while HAProxy reused freely — which is a
# difference between two configs, not between two proxies.
idle_timeout_secs = 90
max_idle_per_host = 500
max_connections_per_host = 20000
acquire_timeout_ms = 5000

[http3]
# OFF for the like-for-like run. These default to on, and each is per-request
# work HAProxy is not doing: coalescing takes a DashMap lookup and possible
# subscriber registration on every GET, early hints builds and writes a 103
# before the real response, priority hints parses and emits a Priority header.
# They are real features and the default is defensible — but a run that leaves
# them on while HAProxy does plain proxying is not the like-for-like comparison
# it claims to be. conf/pqc-bench-features.toml keeps them on for the second
# arm, which is the number anyone actually deploying this should read.
early_hints_enabled = false
priority_hints_enabled = false
coalescing_enabled = false
preconnect_origins = []

[headers]
# Same reasoning: Server-Timing instruments every request and emits a header.
server_timing_enabled = false
